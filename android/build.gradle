apply plugin: "com.android.library"

def safeExtGet(prop, fallback) {
  rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

android {
  namespace "com.vibes.push.rn.plugin"
  compileSdkVersion safeExtGet("compileSdkVersion", 34)
  defaultConfig {
    minSdkVersion safeExtGet("minSdkVersion", 23)
    targetSdkVersion safeExtGet("targetSdkVersion", 34)
  }
  buildTypes {
    release {
      minifyEnabled false
    }
  }
  lintOptions {
    disable "GradleCompatible"
  }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_1_8
    targetCompatibility JavaVersion.VERSION_1_8
  }
}

repositories {
  mavenLocal()
  google()
  mavenCentral()
  // Vendored AAR ships with this package for builds without private Maven access
  maven {
    url new File(projectDir, "libs/maven").absolutePath
  }
  maven {
    url "https://raw.githubusercontent.com/vibes/android-sdk-repository/releases/"
  }
  def githubUser = System.getenv("VIBES_GITHUB_USERNAME")
  def githubPass = System.getenv("VIBES_GITHUB_PASSWORD")
  if (githubUser && githubPass) {
    maven {
      url "https://maven.pkg.github.com/vibes/android-sdk-repository"
      credentials {
        username = githubUser
        password = githubPass
      }
    }
  }
}

dependencies {
  implementation "com.facebook.react:react-android"
  // Exposed to the sample app (MainActivity uses com.vibes.vibes.*); use implementation if app does not import SDK directly.
  api "com.vibes:vibes-android-push-sdk:5.0.1"
  implementation "com.google.firebase:firebase-messaging:23.4.1"
  implementation "com.google.code.gson:gson:2.9.0"
}

